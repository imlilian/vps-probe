name: audit

on:
  push:
    branches: [main]
    paths: ["monitor/Cargo.lock", "agent/Cargo.lock"]
  pull_request:
    paths: ["monitor/Cargo.lock", "agent/Cargo.lock"]
  # Advisories are published without any commit here; a failed scheduled run
  # emails whoever last edited this schedule.
  schedule:
    - cron: "17 3 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - name: hub
        run: cargo audit
        working-directory: monitor
      - name: agent
        run: cargo audit
        working-directory: agent
