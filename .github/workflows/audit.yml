name: audit

# Named rather than left to the commit subject, for the same reason as ci: a
# release commit is exactly when this and every other workflow fire together,
# and three rows reading "release: 0.1.1" say nothing about which is which. A
# scheduled run has no branch of its own, so it is labelled with the default
# branch; the runs list already shows the event in its own column.
run-name: audit · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths: ["monitor/Cargo.lock", "agent/Cargo.lock"]
  pull_request:
    paths: ["monitor/Cargo.lock", "agent/Cargo.lock"]
  # Advisories are published without any commit here; a failed scheduled run
  # emails whoever last edited this schedule.
  schedule:
    - cron: "17 3 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - name: hub
        run: cargo audit
        working-directory: monitor
      - name: agent
        run: cargo audit
        working-directory: agent
