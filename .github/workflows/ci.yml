name: ci

# Without this, GitHub titles a run with the head commit's first line, and a
# commit called "release: 0.1.1" makes ci, audit and release identical in the
# runs list -- one push, three runs that look like the same failed attempt to
# publish. The workflow belongs in the title. `head_ref` is the branch a pull
# request comes from; on a push it is empty and the ref name is the branch.
run-name: ci · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # of both crates plus the two frontends takes a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A test file reaches a bundle only if a module imports it: the entry is
      # index.html -> main.tsx. This keeps that true in both frontends, and it
      # needs nothing but grep, so it fails before any dependency is installed.
      - name: no test in a bundle
        run: sh hub/scripts/no-tests-in-bundle.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            hub/web-admin/package-lock.json
            hub/web-site/package-lock.json

      # Both dist/ trees are build inputs of the hub binary: rust-embed packs
      # them at compile time, and scripts/theme.sh rebuilds the public one from
      # source instead of downloading an archive. Built before cargo, because
      # build.rs runs that script.
      - name: panel
        run: npm ci && npm run lint && npm test && npm run build
        working-directory: hub/web-admin
      - name: public site
        run: npm ci && npm test && npm run build
        working-directory: hub/web-site

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: hub fmt
        run: cargo fmt --all --check
        working-directory: hub
      - name: hub clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: hub
      - name: hub test
        run: cargo test
        working-directory: hub

      - name: agent fmt
        run: cargo fmt --all --check
        working-directory: agent
      - name: agent clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: agent
      - name: agent test
        run: cargo test
        working-directory: agent

      # Both installers run as root on the user's machine. Everything below
      # warning level is SC2015 on `[ a ] && [ b ] || die`, which is meant to
      # die when either test fails.
      - name: installer lint
        run: shellcheck -S warning install-agent.sh install-hub.sh scripts/*.sh
        working-directory: hub

      # The two installers share /opt/probe and, on a hub that reports for
      # itself, run side by side with nothing able to source the other. What they
      # have to agree on -- the directory, that their accounts differ, and their
      # two copies of the account test -- is checked here rather than trusted to
      # a comment. See the script for why each one matters.
      - name: installer agreement
        run: sh scripts/check-installers.sh
        working-directory: hub

      # This commit's hub against this commit's agent. Before the split into one
      # repository each side was tested against the other's latest release,
      # which is the pairing an upgrade meets first; within one tag the two are
      # always built together, so the pairing to check is the one shipping.
      - name: e2e
        run: |
          cargo build --manifest-path hub/Cargo.toml
          cargo build --manifest-path agent/Cargo.toml
          hub/scripts/e2e.sh hub/target/debug/probe-hub agent/target/debug/probe-agent
